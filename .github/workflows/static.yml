name: Deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      operation:
        description: Website deployment operation
        type: choice
        options:
          - publish
          - reset
        default: publish
      reset_confirmation:
        description: For reset, type RESET luminovia.org
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Authorize Website reset
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'reset'
        id: reset
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WEBSITE_RESET_CONFIRMATION: ${{ inputs.reset_confirmation }}
          WEBSITE_RESET_GENERATION: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/website-reset.mjs authorize

      - name: Install dependencies
        run: npm ci

      - name: Build Vite website
        env:
          VITE_ENQUIRY_URL: ${{ vars.VITE_ENQUIRY_URL }}
          VITE_ENQUIRY_SITE_KEY: ${{ vars.VITE_ENQUIRY_SITE_KEY }}
          VITE_ENQUIRY_PRIVACY_VERSION: ${{ vars.VITE_ENQUIRY_PRIVACY_VERSION }}
        run: npm run build

      - name: Give the reset artifact a fresh Website cache
        if: steps.reset.outputs.generation != ''
        env:
          WEBSITE_RESET_GENERATION: ${{ steps.reset.outputs.generation }}
        run: node scripts/website-reset.mjs stamp

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
